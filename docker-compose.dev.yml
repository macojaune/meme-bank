services:
  # TimescaleDB with pgvector support
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: memebank_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: memebank_dev
      POSTGRES_USER: memebank_user
      POSTGRES_PASSWORD: memebank_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data/pgdata
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - '5434:5432'
    networks:
      - memebank_dev_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memebank_user -d memebank_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3 Compatible)
  minio:
    image: minio/minio
    container_name: memebank_minio_dev
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    networks:
      - memebank_dev_network

  # Redis for BullMQ job queues
  redis:
    image: redis:7-alpine
    container_name: memebank_redis_dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - memebank_dev_network
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes

  # MemeBank App with Whisper.cpp
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memebank_app_dev
    restart: unless-stopped
    ports:
      - '63240:63240'
    networks:
      - memebank_dev_network
    environment:
      - NODE_ENV=development
      - PORT=63240
      - HOST=0.0.0.0
      - APP_KEY=${APP_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=memebank_user
      - DB_PASSWORD=memebank_password
      - DB_DATABASE=memebank_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=memes
      - MINIO_REGION=us-east-1
      - AI_PROVIDER=whispercpp
      - WHISPER_MODEL_PATH=/models/ggml-base.bin
      - WHISPER_CLI_PATH=/usr/local/bin/whisper-cli
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
    depends_on:
      - postgres
      - redis
      - minio
    # Override CMD to run in dev mode with hot reload
    command: ['sh', '-c', 'npm run dev']
    volumes:
      - .:/app
      - /app/node_modules

  # Queue Workers for transcription, embedding, and video processing
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memebank_workers_dev
    restart: unless-stopped
    networks:
      - memebank_dev_network
    environment:
      - NODE_ENV=development
      - PORT=63240
      - HOST=0.0.0.0
      - APP_KEY=${APP_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=memebank_user
      - DB_PASSWORD=memebank_password
      - DB_DATABASE=memebank_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=memes
      - MINIO_REGION=us-east-1
      - AI_PROVIDER=whispercpp
      - WHISPER_MODEL_PATH=/models/ggml-base.bin
      - WHISPER_CLI_PATH=/usr/local/bin/whisper-cli
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - WORKER_MODE=true
    depends_on:
      - postgres
      - redis
      - minio
    command: ['sh', '-c', 'sleep 5 && node ace queue:work all']
    volumes:
      - .:/app
      - /app/node_modules

  # Database Admin Interface
  adminer:
    image: adminer:latest
    container_name: memebank_adminer_dev
    restart: unless-stopped
    ports:
      - '8080:8080'
    networks:
      - memebank_dev_network
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
    driver: local
  minio_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  memebank_dev_network:
    driver: bridge
